name: terminais no Windows

on:
  push:
    branches: [main, "windows-**"]
    paths:
      - "terminal-claude/**"
      - "terminal-organizar/**"
      - ".github/workflows/windows-terminais.yml"
  pull_request:
    paths:
      - "terminal-claude/**"
      - "terminal-organizar/**"
      - ".github/workflows/windows-terminais.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-terminais-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experimento:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: um .cmd entre o python e o programa estraga o prompt?
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force cmdteste | Out-Null
          Set-Content cmdteste\eco.cmd '@python -c "import sys, json; print(json.dumps(sys.argv[1:], ensure_ascii=False))" %*'
          python -c "import subprocess, json; p = 'Leia \"docs/x.md\" e % ^ & | > < ação\nsegunda linha'; r = subprocess.run(['cmdteste\\eco.cmd', p], capture_output=True, text=True, encoding='utf-8', errors='replace'); print('saida:', r.stdout, r.stderr); print('igual:', r.stdout.strip() == json.dumps([p], ensure_ascii=False))"
      - name: claude pelo npm
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code 2>&1 | Select-Object -Last 3
          Get-Command claude -All -ErrorAction SilentlyContinue | Format-Table Name, CommandType, Source -AutoSize | Out-String -Width 300
          python -c "import shutil; print('which:', shutil.which('claude'))"
          claude --version
      - name: claude nativo (instalador oficial)
        continue-on-error: true
        run: |
          npm uninstall -g @anthropic-ai/claude-code 2>&1 | Select-Object -Last 1
          irm https://claude.ai/install.ps1 | iex
          "user PATH tem .local\bin: $([Environment]::GetEnvironmentVariable('Path','User') -like '*\.local\bin*')"
          Get-ChildItem "$env:USERPROFILE\.local\bin" -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          python -c "import shutil; print('which:', shutil.which('claude'))"
          claude --version
      - name: python pelo winget
        continue-on-error: true
        run: |
          winget install --id Python.Python.3.12 -e --accept-source-agreements --accept-package-agreements --disable-interactivity 2>&1 | Select-Object -Last 3
          "user PATH: $([Environment]::GetEnvironmentVariable('Path','User'))"
          "machine PATH tem Python312: $([Environment]::GetEnvironmentVariable('Path','Machine') -like '*Python312*')"
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          Get-Command python -All -ErrorAction SilentlyContinue | Format-Table Name, Source -AutoSize | Out-String -Width 300
      - name: resolução maior
        continue-on-error: true
        run: |
          Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue | Format-List Name, Source
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Start-Sleep 2
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List Bounds, WorkingArea | Out-String
