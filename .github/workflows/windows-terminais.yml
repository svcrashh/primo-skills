name: terminais no Windows

on:
  push:
    branches: [main, "windows-**"]
    paths:
      - "terminal-claude/**"
      - "terminal-organizar/**"
      - ".github/workflows/windows-terminais.yml"
  pull_request:
    paths:
      - "terminal-claude/**"
      - "terminal-organizar/**"
      - ".github/workflows/windows-terminais.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-terminais-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonda:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: sistema
        continue-on-error: true
        run: |
          [Environment]::OSVersion
          (Get-CimInstance Win32_OperatingSystem).Caption
          "sessao: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId)  interativo: $([Environment]::UserInteractive)"
          query session 2>&1
          "usuario: $env:USERNAME"
          Get-Command winget, wt, bash, pwsh, powershell, python, py -ErrorAction SilentlyContinue | Format-Table Name, Source -AutoSize | Out-String -Width 300
          Get-AppxPackage *WindowsTerminal* | Format-List Name, Version, InstallLocation | Out-String -Width 300
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List DeviceName, Bounds, WorkingArea, Primary | Out-String -Width 300
          Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue
          fsutil 8dot3name query C:
          fsutil 8dot3name query D:
          "TEMP=$env:TEMP RUNNER_TEMP=$env:RUNNER_TEMP"
      - name: testes simulados no Python do Windows
        continue-on-error: true
        run: |
          python terminal-claude/scripts/teste_windows_simulado.py
          python terminal-claude/scripts/teste_mac_simulado.py
      - name: tenta winget
        continue-on-error: true
        run: |
          winget --version
          winget install --id Microsoft.WindowsTerminal -e --accept-source-agreements --accept-package-agreements --disable-interactivity
          Get-AppxPackage *WindowsTerminal* | Format-List Name, Version | Out-String
          Get-Command wt -ErrorAction SilentlyContinue | Format-List Source
      - name: abre uma janela do wt
        continue-on-error: true
        run: |
          $wt = (Get-Command wt -ErrorAction SilentlyContinue).Source
          if (-not $wt) { $wt = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\wt.exe" }
          "wt: $wt  existe: $(Test-Path $wt)"
          Start-Process $wt -ArgumentList '-w','new','nt','--title','sonda','cmd','/k','echo oi'
          Start-Sleep 8
          Get-Process WindowsTerminal, OpenConsole -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, SessionId, MainWindowTitle -AutoSize | Out-String -Width 300
          python -c "import sys; sys.path.insert(0, 'terminal-organizar/scripts'); import janelas_win as w; print('monitores', w.monitores()); print('janelas', w.janelas())"
      - name: captura da tela
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($img)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force captura | Out-Null
          $img.Save("captura\sonda.png")
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sonda
          path: captura/
          if-no-files-found: ignore
