name: windows-play

on:
  push:
    branches: [main, 'windows-**']
    paths: ['play/**', 'instalar.ps1', 'instalar.sh', '.github/workflows/windows-play.yml']
  pull_request:
    paths: ['play/**', 'instalar.ps1', 'instalar.sh', '.github/workflows/windows-play.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', 'lts/*']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: ffmpeg pelo winget
        shell: pwsh
        run: |
          winget install ffmpeg --accept-source-agreements --accept-package-agreements --disable-interactivity | Select-String -Pattern 'Found|alias|Path|installed'
          "usuario: " + [Environment]::GetEnvironmentVariable('Path', 'User')
          "maquina: " + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          "sessao: $env:Path"
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Links" -ErrorAction SilentlyContinue | Format-Table Name, LinkType, Target -AutoSize
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -ErrorAction SilentlyContinue | Format-Table Name -AutoSize
          Get-ChildItem "$env:ProgramFiles\WinGet\Links", "$env:ProgramFiles\WinGet\Packages" -ErrorAction SilentlyContinue | Format-Table FullName, LinkType -AutoSize
          "$env:LOCALAPPDATA\Microsoft\WinGet\Links", "$env:ProgramFiles\WinGet\Links" | Add-Content $env:GITHUB_PATH
      - name: testes da play
        shell: pwsh
        run: node --test play/tests/play.test.mjs play/tests/requisitos.test.mjs

  explorar:
    runs-on: windows-latest
    steps:
      - name: o python da Microsoft Store
        shell: pwsh
        run: |
          $semPython = ($env:Path -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'python.exe')) }) + "$env:LOCALAPPDATA\Microsoft\WindowsApps"
          $env:Path = $semPython -join ';'
          Get-Command python -All | Format-Table Name, Source, CommandType
          & python -c "import sys; print(sys.version)"
          "saiu com $LASTEXITCODE"
          & python --version
          "saiu com $LASTEXITCODE"
      - name: console no 5.1
        shell: powershell
        run: |
          "OutputEncoding=$([Console]::OutputEncoding.WebName) InputEncoding=$([Console]::InputEncoding.WebName) ACP=$([Text.Encoding]::Default.WebName)"
          & node -e "console.log('node antes:', String.fromCodePoint(0xe1, 0x2714, 0x2716, 0x25cb))"
          try { [Console]::OutputEncoding = [System.Text.Encoding]::UTF8; "trocou para $([Console]::OutputEncoding.WebName)" } catch { "nao deu: $_" }
          & node -e "console.log('node depois:', String.fromCodePoint(0xe1, 0x2714, 0x2716, 0x25cb))"
          Add-Type -AssemblyName PresentationCore
          foreach ($f in 'consola.ttf', 'lucon.ttf', 'CascadiaMono.ttf', 'CascadiaCode.ttf', 'seguisym.ttf') {
            $p = Join-Path $env:WINDIR "Fonts\$f"
            if (-not (Test-Path $p)) { "$f nao existe"; continue }
            $g = New-Object System.Windows.Media.GlyphTypeface ([uri]$p)
            $f + ' ' + ((0x2714, 0x2716, 0x25CB, 0x2014, 0xE1 | ForEach-Object { '{0:X4}={1}' -f $_, $g.CharacterToGlyphMap.ContainsKey($_) }) -join ' ')
          }
