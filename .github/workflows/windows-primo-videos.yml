# A primo-videos num Windows de verdade (o runner windows-latest): a instalação como a pessoa faz, a suíte e um vídeo de
# ponta a ponta. Sem segredo e sem API paga: a voz vem da ElevenLabs de mentira dos testes (tests/fake-api.mjs).
name: primo-videos no Windows

on:
  push:
    branches: [main, 'windows-**']
    paths: ['primo-videos/**', '.github/workflows/windows-primo-videos.yml']
  pull_request:
    paths: ['primo-videos/**', '.github/workflows/windows-primo-videos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sem cache e sem setup-node: o que a pessoa vê no PowerShell, do primeiro requisitos ao ambiente pronto.
  instalar:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - name: Os pacotes que o requisitos.mjs manda instalar existem no winget
        run: |
          foreach ($id in 'OpenJS.NodeJS.LTS', 'ffmpeg', 'Python.Python.3.12', 'Microsoft.WindowsTerminal') {
            $saida = winget show $id --accept-source-agreements --disable-interactivity
            $codigo = $LASTEXITCODE
            $saida | Where-Object { $_ -match '^(Found|Version|Encontrado|Vers)' }
            if ($codigo) { throw "winget show $id falhou ($codigo)" }
          }
      - name: requisitos.mjs numa máquina sem ffmpeg e sem a conferência
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          node primo-videos/scripts/requisitos.mjs
          if ($LASTEXITCODE -ne 1) { throw "esperava codigo 1 (falta o ffmpeg e a conferencia), veio $LASTEXITCODE" }
          exit 0
      - name: winget install ffmpeg e winget install Python.Python.3.12
        run: |
          winget install ffmpeg --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE) { throw "winget install ffmpeg: $LASTEXITCODE" }
          winget install Python.Python.3.12 --accept-source-agreements --accept-package-agreements --disable-interactivity
          "winget install Python.Python.3.12: codigo $LASTEXITCODE"
          # o PATH novo só vale num PowerShell novo: os próximos passos são processos novos
          Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: ffmpeg e Python com o nome que a skill procura
        run: |
          Get-Command ffmpeg, ffprobe, py | Format-Table Name, Source -AutoSize
          py -0p
      - name: environment.mjs --fix sem --yes diz o que baixaria e não baixa
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          node primo-videos/scripts/environment.mjs --fix
          if ($LASTEXITCODE -ne 2) { throw "esperava codigo 2 (falta o Chromium), veio $LASTEXITCODE" }
          exit 0
      - name: environment.mjs --fix --yes
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          node primo-videos/scripts/environment.mjs --fix --yes
          if ($LASTEXITCODE) { throw "environment.mjs --fix --yes: $LASTEXITCODE" }
      - name: A chave salva pelo Bloco de Notas (BOM e CRLF) vale e não aparece
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $d = "$env:USERPROFILE\.claude\secrets"
          New-Item -ItemType Directory -Force $d | Out-Null
          # o Set-Content do PowerShell 5.1 grava UTF-8 com BOM e CRLF, como o Bloco de Notas pode gravar (sem acento aqui: o 5.1 le o passo como ANSI)
          Set-Content -Path "$d\elevenlabs.env" -Encoding UTF8 -Value 'ELEVENLABS_API_KEY=chave-falsa-do-runner'
          $saida = node primo-videos/scripts/requisitos.mjs | Out-String
          $codigo = $LASTEXITCODE
          $saida
          if ($codigo -ne 0) { throw "esperava codigo 0 (nada obrigatorio falta), veio $codigo" }
          if ($saida -match 'chave-falsa') { throw 'o valor da chave apareceu na saida' }
          if ($saida -notmatch 'Voz em off: chave da ElevenLabs \(ELEVENLABS_API_KEY\) encontrada') { throw 'a chave do arquivo nao foi achada' }
          Remove-Item -Recurse -Force $d

  testes:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache do Playwright, do Chromium e do Python da trilha
        uses: actions/cache@v6
        with:
          path: |
            ~\.videostudio\node
            ~\.videostudio\venv
            ~\AppData\Local\ms-playwright
          key: ambiente-${{ runner.os }}-${{ hashFiles('primo-videos/scripts/environment.mjs') }}-1
      - name: ffmpeg pelo winget
        shell: pwsh
        run: |
          winget install ffmpeg --accept-source-agreements --accept-package-agreements --disable-interactivity
          Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: environment.mjs --fix --yes
        run: node primo-videos/scripts/environment.mjs --fix --yes
      - name: A suíte
        working-directory: primo-videos
        env:
          JANELA_TESTE_SAIDA: ${{ runner.temp }}\janela
        run: node --test --test-reporter=spec "tests/*.test.mjs"
      - name: Sobe a gravação de janela do teste (record-window)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: janela-windows
          path: ${{ runner.temp }}\janela
          if-no-files-found: warn
          retention-days: 7

  # O caminho de um vídeo, pelos comandos que o SKILL.md manda rodar, no Git Bash (onde o Claude Code do Windows roda
  # os comandos). Sobe o MP4 e as folhas como artefato.
  video:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SK: ${{ github.workspace }}\primo-videos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache do Playwright, do Chromium e do Python da trilha
        uses: actions/cache@v6
        with:
          path: |
            ~\.videostudio\node
            ~\.videostudio\venv
            ~\AppData\Local\ms-playwright
          key: ambiente-${{ runner.os }}-${{ hashFiles('primo-videos/scripts/environment.mjs') }}-1
      - name: ffmpeg pelo winget
        shell: pwsh
        run: |
          winget install ffmpeg --accept-source-agreements --accept-package-agreements --disable-interactivity
          Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: environment.mjs --fix --yes
        run: |
          node "$SK/scripts/environment.mjs" --fix --yes
          node "$SK/scripts/playwright.cjs" --gpu || true
      - name: Projeto novo a partir do molde e o rascunho
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/e2e/demo"
          node "$SK/scripts/new-project.mjs" "$P" --title "Teste no Windows" --duration 8 --bpm 120 --formats 16x9
          node "$P/tools/render.cjs" --project "$P" --mode draft
          ls "$P/out" "$P/previas"
      - name: A trilha sintetizada em Python, conferida
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/e2e/demo"
          PY=$(node -e "console.log(require(process.argv[1]).acharPython())" "$SK/scripts/where.cjs")
          echo "python da trilha: $PY"
          cp "$SK/assets/audio/api_example.py" "$SK/assets/audio/sheet_api_example.json" "$P/audio/"
          cd "$P/audio"
          "$PY" api_example.py
          "$PY" verify.py sheet_api_example.json
      - name: Finalizar e conferir o MP4
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/e2e/demo"
          node "$P/tools/finalize.mjs" --project "$P" --video out/draft-16x9.mp4 --audio audio/exemplo-api.wav --sheet audio/sheet_api_example.json --out "$RUNNER_TEMP/e2e/entrega/demo-16x9.mp4"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate:format=duration -of compact "$RUNNER_TEMP/e2e/entrega/demo-16x9.mp4"
          ffmpeg -v error -y -i "$RUNNER_TEMP/e2e/entrega/demo-16x9.mp4" -vf "fps=3,scale=480:-1,tile=6x4" -frames:v 1 "$RUNNER_TEMP/e2e/entrega/folha-demo-16x9.png"
      - name: O refino lê o texto do vídeo com o OCR do Windows
        run: |
          set -euo pipefail
          node "$SK/scripts/refine/video.mjs" "$RUNNER_TEMP/e2e/entrega/demo-16x9.mp4" --json --checks legibilidade,area-segura > "$RUNNER_TEMP/e2e/entrega/refino.json" || true
          node -e "const j = require(process.argv[1]); console.log(JSON.stringify({ ocr: j.medidas.ocr, quadros: j.medidas.quadrosOcr, linhas: j.medidas.linhasOcr, achados: j.achados.map((a) => a.nivel + ' ' + a.msg) }, null, 1)); if (j.medidas.ocr !== 'windows' || !(j.medidas.linhasOcr > 0)) process.exit(1)" "$RUNNER_TEMP/e2e/entrega/refino.json"
      - name: Os moldes counting-number e light-trail-teaser, do exemplo ao MP4 (render.mjs)
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/e2e"
          node "$SK/scripts/example-fonts.mjs" "$O/numeros"
          node "$SK/templates/counting-number/render.mjs" "$SK/templates/counting-number/example.json" "$O/numeros" 16x9 draft
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height:format=duration -of compact "$O/numeros/delivery/numeros-16x9.mp4"
          cp "$O/numeros/delivery/numeros-16x9.mp4" "$O/numeros/delivery/sheet-16x9.png" "$O/entrega/"
          node "$SK/scripts/example-fonts.mjs" "$O/teaser/project"
          MODO=draft node "$SK/templates/light-trail-teaser/render.mjs" "$SK/templates/light-trail-teaser/example.json" "$O/teaser" 16x9
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height:format=duration -of compact "$O/teaser/example-16x9.mp4"
          cp "$O/teaser/example-16x9.mp4" "$O/teaser/sheet-example-16x9.png" "$O/entrega/"
      - name: Um vídeo em capítulos com voz, pela ElevenLabs de mentira dos testes
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/capitulos.mjs" <<'EOF'
          // Um vídeo em capítulos com voz, de ponta a ponta, contra a ElevenLabs de mentira dos testes (nada pago, nada de rede).
          //   node capitulos.mjs <skill> <pasta de trabalho>
          import path from 'node:path'
          import fs from 'node:fs'
          import { spawn } from 'node:child_process'
          import { pathToFileURL } from 'node:url'
          const [SK, O] = process.argv.slice(2)
          const { subirApiFalsa } = await import(pathToFileURL(path.join(SK, 'tests', 'fake-api.mjs')).href)
          const CHAVE = 'chave-falsa-do-teste'
          const api = await subirApiFalsa({ chave: CHAVE })
          api.estado.vozes.v1 = { voice_id: 'v1', name: 'Invented Voice', category: 'professional', is_owner: false, sharing: { disable_at_unix: null, notice_period: 365 } }
          const env = { ...process.env, ELEVENLABS_API_BASE: api.url, ELEVENLABS_API_KEY: CHAVE }
          const P = path.join(O, 'capitulos'), ENTREGA = path.join(O, 'entrega')
          // assíncrono: a API falsa mora neste processo e precisa do laço de eventos livre para responder
          const roda = (rotulo, args) => new Promise((resolve, reject) => {
            console.log(`\n$ ${rotulo}`)
            spawn(process.execPath, args, { env, stdio: 'inherit' }).on('close', (c) => (c === 0 ? resolve() : reject(new Error(`${rotulo}: código ${c}`))))
          })
          try {
            await roda('chapters/new.mjs', [path.join(SK, 'scripts', 'chapters', 'new.mjs'), P, '--formats', '16x9'])
            // o capítulo de verdade é uma cópia do exemplo (o 01-example fica fora da montagem, como manda o molde)
            fs.cpSync(path.join(P, 'scenes', '01-example'), path.join(P, 'scenes', '01-painel'), { recursive: true })
            fs.rmSync(path.join(P, 'scenes', '01-example'), { recursive: true, force: true })
            // a identidade da trilha (que a skill escreve a partir da leitura do produto): a do exemplo de série, cedendo à voz
            const ident = JSON.parse(fs.readFileSync(path.join(SK, 'assets', 'example', 'computer-tutorial-series', 'identity.json'), 'utf8'))
            fs.writeFileSync(path.join(P, 'audio', 'identity.json'), JSON.stringify({ ...ident, papel: 'fundo' }, null, 2))
            const rot = { idioma: 'en-US', perfil: 'calmo', voz: { id: 'v1', nome: 'Invented Voice' }, falas: [
              { id: 'abertura', onde: 'abertura', texto: 'A tour of the new board.' },
              { id: 'c1', onde: { capitulo: 1 }, texto: 'Pick a scene and approve its still.' },
              { id: 'fechamento', onde: 'fechamento', texto: 'That is all it takes.' }] }
            fs.mkdirSync(path.join(P, 'voice', 'v1'), { recursive: true })
            fs.writeFileSync(path.join(P, 'voice', 'v1', 'script.json'), JSON.stringify(rot, null, 1))
            await roda('voice.mjs review', [path.join(SK, 'scripts', 'voice.mjs'), 'review', path.join(P, 'voice', 'v1', 'script.json')])
            await roda('voice.mjs generate', [path.join(SK, 'scripts', 'voice.mjs'), 'generate', path.join(P, 'voice', 'v1', 'script.json'), '--out', path.join(P, 'voice', 'v1')])
            await roda('chapters/tempos.mjs', [path.join(SK, 'scripts', 'chapters', 'tempos.mjs'), P, '--narration', 'voice/v1/narration.json'])
            await roda('chapters/render.mjs all', [path.join(SK, 'scripts', 'chapters', 'render.mjs'), P, 'all', '--mode', 'draft'])
            await roda('chapters/assemble.mjs', [path.join(SK, 'scripts', 'chapters', 'assemble.mjs'), P, '--narration', 'voice/v1/narration.json', '--profile', 'calmo', '--soundtrack', '--deliver', ENTREGA])
            console.log(`\npedidos à API falsa: ${api.pedidos.length} (${api.tts().length} de voz)`)
          } catch (e) { console.error(e.message); process.exitCode = 1 } finally { await api.fechar() }
          EOF
          node "$RUNNER_TEMP/capitulos.mjs" "$SK" "$RUNNER_TEMP/e2e"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height:format=duration -of compact "$RUNNER_TEMP/e2e/entrega/capitulos-16x9.mp4"
          ffmpeg -v error -y -i "$RUNNER_TEMP/e2e/entrega/capitulos-16x9.mp4" -vf "fps=1,scale=480:-1,tile=5x5" -frames:v 1 "$RUNNER_TEMP/e2e/entrega/folha-capitulos-16x9.png"
      - name: O painel de revisão sobe, responde e ouve o clique (pelo Playwright)
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/e2e/demo"
          cp "$P/previas/auto-cenas.png" "$P/still-1.png"
          cat > "$RUNNER_TEMP/board.json" <<'EOF'
          { "title": "Teste no Windows", "subtitle": "8 s · 16:9",
            "scenes": [ { "id": "s1", "title": "A demo do motor", "seconds": 8, "state": "concept", "still": "still-1.png" },
                        { "id": "s2", "title": "O rascunho", "seconds": 8, "state": "animated-preview", "still": "still-1.png", "video": "out/draft-16x9.mp4" } ] }
          EOF
          node "$SK/scripts/board.mjs" set "$P" "$RUNNER_TEMP/board.json"
          URL=$(node "$SK/scripts/board.mjs" open "$P" --no-open)
          echo "painel: $URL"
          cat > "$RUNNER_TEMP/painel.cjs" <<'EOF'
          const { abrirNavegador } = require(process.env.SK + '/scripts/playwright.cjs')
          ;(async () => {
            const [url, saida] = process.argv.slice(2)
            const { browser } = await abrirNavegador()
            const pg = await browser.newPage({ viewport: { width: 1280, height: 900 } })
            await pg.goto(url)
            await pg.getByRole('button', { name: 'Approve still' }).first().click()
            await pg.getByText('You approved the still.').first().waitFor({ timeout: 15000 })
            await pg.screenshot({ path: saida, fullPage: true })
            await browser.close()
          })().catch((e) => { console.error(e); process.exit(1) })
          EOF
          node "$RUNNER_TEMP/painel.cjs" "$URL" "$RUNNER_TEMP/e2e/entrega/painel.png"
          node "$SK/scripts/board.mjs" events "$P" | tee "$RUNNER_TEMP/e2e/entrega/eventos.jsonl"
          grep -q '"approve-still"' "$RUNNER_TEMP/e2e/entrega/eventos.jsonl"
          node "$SK/scripts/board.mjs" stop "$P"
      - name: Abrir de verdade - a página do catálogo, o painel no navegador e o Windows Terminal do board agent
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/e2e/demo"
          janelas() { powershell.exe -NoProfile -Command "Get-Process $1 -ErrorAction SilentlyContinue | Where-Object MainWindowTitle | ForEach-Object { \$_.MainWindowTitle }"; }
          # o catálogo abre a página pelo explorer.exe, no navegador padrão
          node "$SK/scripts/catalog.mjs" open --out "$RUNNER_TEMP/estilos.html"
          for i in $(seq 1 20); do [ -n "$(janelas msedge)" ] && break; sleep 1; done
          echo "navegador depois do catálogo: $(janelas msedge)"
          [ -n "$(janelas msedge)" ]
          # o painel abre a URL dele no navegador padrão (sem --no-open)
          node "$SK/scripts/board.mjs" open "$P"
          sleep 5
          echo "navegador depois do painel: $(janelas msedge)"
          node "$SK/scripts/board.mjs" stop "$P"
          # board agent --terminal: o Windows Terminal abre na pasta do projeto e roda o claude (aqui um falso, que só
          # anota como foi chamado) com o prompt do painel
          mkdir -p "$RUNNER_TEMP/claude-falso"
          cat > "$RUNNER_TEMP/claude-falso/claude.js" <<'EOF'
          require('fs').writeFileSync(require('path').join(__dirname, 'chamado.json'), JSON.stringify({ argumentos: process.argv.slice(2), pasta: process.cwd() }, null, 1))
          EOF
          CRITIC_CLAUDE="$RUNNER_TEMP\\claude-falso\\claude.js" node "$SK/scripts/board.mjs" agent "$P" --terminal
          for i in $(seq 1 30); do [ -f "$RUNNER_TEMP/claude-falso/chamado.json" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/claude-falso/chamado.json"
          grep -q 'Serve the review board' "$RUNNER_TEMP/claude-falso/chamado.json"
          echo "janelas do Windows Terminal: $(janelas WindowsTerminal)"
      - name: Sobe o vídeo, as folhas e o painel
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-windows
          path: |
            ${{ runner.temp }}\e2e\entrega
            ${{ runner.temp }}\e2e\demo\previas
          if-no-files-found: warn
          retention-days: 7
